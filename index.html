<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Benson_head.png" type="image/png">
    <link rel="stylesheet" href="/src/styles.css">
    <title>Regular Show Quote of the Day</title>
</head>

<body>
    <img id="regularShowLogo" class="fade-in" src="/regular_show_logo.png" alt="Logo">
    <h1 id="siteTitle" class="fade-in"></h1>

    <div id="content">
        <img id="characterImage" class="fade-in" src="" alt="Character Image">
        <div class="dialogue fade-in dialogue-box" id="dialogueText"></div>
    </div>

    <div id="citation" class="fade-in"></div>
    <div id="tagline" class="fade-in"></div>
    <button id="shareButton" onclick="shareQuote()">&#128279; Share Quote</button>
    <input type="date" id="datePicker">
    <button id="backToToday" onclick="goToToday()">&#8617; Back to Today</button>
    <div id="countdown">Loading countdown...</div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
