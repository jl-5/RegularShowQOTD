<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Benson_head.png" type="image/png">

    <title>Regular Show QOTD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="column-container">
        <img id="regularShowLogo" class="fade-in" src="regular_show_logo.png" alt="Logo">
        <h1 id="siteTitle" class="fade-in"
            style="font-family: monospace; position: relative; top: -0px; text-align: center;"></h1>
        <div id="content">
            <img id="characterImage" class="fade-in" src="" alt="Character Image">
            <div class="dialogue fade-in dialogue-box" id="dialogueText"
                style="font-family: Bookman, URW Bookman L, serif;"></div>
        </div>
        <div id="citation" class="fade-in" style="font-family: monospace"></div>
        <div id="tagline" class="fade-in" style="font-style: italic; font-family: monospace;"></div>
    </div>
    <div id="countdown" class="countdown"> Loading countdown...</div>
    <script>

        let dialogueData = [];
        fetch(`dialogue_data.json?nocache=${new Date().toISOString().split('T')[0]}`)
            .then(response => response.json())
            .then(data => {
                dialogueData = data;
                showRandomLine();
            });

        let taglines = [];
        fetch(`taglines.txt?nocache=${new Date().toISOString().split('T')[0]}`)
            .then(response => response.text())
            .then(text => {
                taglines = text.split('\n').filter(line => line.trim() !== '');
            });


        const imageElement = document.getElementById('characterImage');
        const body = document.body;

        function showRandomLine() {
            if (dialogueData.length === 0) return;

            // Create a daily seed based on the current date using toLocaleString
            const todayDate = new Date();
            console.log("Today's date:", todayDate.toLocaleString());
            console.log("Today's date (locale date only):", todayDate.toLocaleDateString());

            // Format the date as "YYYY-MM-DD" using locale parts
            const dateParts = todayDate.toLocaleDateString('en-CA'); // 'en-CA' gives "YYYY-MM-DD"
            console.log("Today's date (locale en-CA):", dateParts);

            const today = dateParts; // "2025-06-07"

            const seed = hashCode(today);
            console.log(`Today's seed: ${seed}`);

            // Generate a random dialogue line using today's seed
            const shuffled = seededShuffle(dialogueData, seed);
            console.log("Shuffled dialogue data:", shuffled.slice(0, 10)); // Log first 10 shuffled items for debugging
            console.log("Selected item:", shuffled[0]);
            const item = shuffled[0];

            const taglineTemplate = seededShuffle(taglines, seed)[0];
            const tagline = taglineTemplate.replace(/\[character\]/gi, item.character);


            const imageElement = document.getElementById('characterImage');
            const dialogueText = document.getElementById('dialogueText');
            const taglineEl = document.getElementById('tagline');
            const citationEl = document.getElementById('citation');

            imageElement.src = item.image;
            imageElement.alt = item.character;
            dialogueText.innerHTML = `<span class="quote-line">"${item.line}"</span>`;

            citationEl.innerHTML = `— <strong>${item.character}</strong>, ${item.episode_code}: "${item.episode}"`;
            taglineEl.innerHTML = `${tagline}`;
        }

        // Simple hash function to turn date string into number (courtesy of ChatGPT)
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const chr = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + chr;
                hash |= 0; // Convert to 32bit integer
            }
            return Math.abs(hash);
        }

        // Function to shuffle an array deterministically using a seed (courtesy of ChatGPT)
        function seededShuffle(array, seed) {
            let result = [...array];
            let random = mulberry32(seed);
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        // Mulberry32: simple deterministic PRNG (courtesy of ChatGPT)
        function mulberry32(seed) {
            return function () {
                var t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        window.onload = () => {

            const START_DELAY = 0; // Delay before starting the fade-in effect
            const LOADING_TIME = 1500;

            const fadeIns = document.querySelectorAll('.fade-in');

            setTimeout(() => {
                fadeIns.forEach((el, i) => {
                    setTimeout(() => {
                        el.classList.add('visible');
                    }, i * LOADING_TIME);
                });
            }, START_DELAY);

            // Set the site title with today's date
            const siteTitle = document.getElementById('siteTitle');
            const today = new Date();
            const dateStr = today.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
            siteTitle.innerHTML = `<em>Random Quote of the Day</em>: ${dateStr}`;

        };


        function updateCountdown() {
            const now = new Date();
            const midnight = new Date();
            midnight.setHours(24, 0, 0, 0); // set to next midnight

            const diff = midnight - now;

            const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
            const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

            document.getElementById("countdown").innerHTML =
                `Created by <a href="https://github.com/jl-5" target="_blank" style="color: white; text-decoration: underline;">jl-5</a>. Next quote in ${hours}:${minutes}:${seconds}`;
        }


        //const quoteSpan = dialogueText.querySelector('.quote-line');

        // Start with max font size
        let fontSize = window.innerWidth < 768 ? 2.0 : 3.5;
        dialogueText.style.fontSize = `${fontSize}em`;

        // Max number of lines allowed
        const maxLines = 2;

        const getLineHeight = () => {
            const testEl = document.createElement("span");
            testEl.style.fontSize = dialogueText.style.fontSize;
            testEl.style.fontFamily = window.getComputedStyle(dialogueText).fontFamily;
            testEl.innerText = "A";
            document.body.appendChild(testEl);
            const height = testEl.offsetHeight;
            document.body.removeChild(testEl);
            return height;
        };

        while (fontSize > 0.5) {
            const lineHeight = getLineHeight();
            const numLines = Math.ceil(dialogueText.scrollHeight / lineHeight);

            if (numLines <= maxLines) {
                break;
            }

            fontSize -= 0.1;
            quoteSpan.style.fontSize = `${fontSize}em`;
        }

        // Start countdown and refresh every second
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function scheduleMidnightRefresh() {
            const now = new Date();
            const midnight = new Date();
            midnight.setHours(24, 0, 0, 0); // next midnight

            const msUntilMidnight = midnight - now;

            setTimeout(() => {
                location.reload(); // reloads page at midnight
            }, msUntilMidnight);
        }

        scheduleMidnightRefresh();


    </script>
</body>

</html>
